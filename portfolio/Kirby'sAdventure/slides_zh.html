<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>《卡比的冒险》 -幻灯片</title>

    <link rel="icon" href="../../assets/images/logo.png" type="image/png">


    <style>
        :root{
            --bg: #0b0b0b;
            --card: rgba(255,255,255,0.06);
            --text: rgba(255,255,255,0.88);
        }

        html, body { height: 100%; margin: 0; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }

        /* Scroll-snap deck */
        .deck{
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            padding: 18px 0;
            box-sizing: border-box;
        }

        .slide{
            height: calc(100vh - 36px);
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            box-sizing: border-box;
        }

        .slide img{
            max-width: min(1200px, 96vw);
            max-height: 92vh;
            width: auto;
            height: auto;
            border-radius: 14px;
            background: var(--card);
            box-shadow: 0 14px 40px rgba(0,0,0,.45);
        }

        /* HUD */
        .hud{
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .chip{
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .btn{
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: var(--text);
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 14px;
            transition: transform .12s ease, filter .12s ease;
            user-select: none;
        }
        .btn:hover{ filter: brightness(1.15); transform: translateY(-1px); }

        .hint{
            opacity: .8;
            font-size: 13px;
        }
    </style>
</head>

<body>
<div class="deck" id="deck">

    <!-- 12 slides -->
    <section class="slide"><img src="./slides/slide11.PNG"  alt="第 1 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide12.PNG"  alt="第 2 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide13.PNG"  alt="第 3 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide14.PNG"  alt="第 4 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide15.PNG"  alt="第 5 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide16.PNG"  alt="第 6 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide17.PNG"  alt="第 7 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide18.PNG"  alt="第 8 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide19.PNG"  alt="第 9 张幻灯片"  loading="lazy"></section>
    <section class="slide"><img src="./slides/slide20.PNG" alt="第 10 张幻灯片" loading="lazy"></section>

</div>

<div class="hud">
    <div class="chip" id="page">1 / 10</div>

    <div class="chip hint">鼠标滚动 / 方向键 / 翻页键 / 空格键</div>

    <div class="chip">
        <button class="btn" id="prev" type="button">上一页</button>
        <button class="btn" id="next" type="button">下一页</button>
    </div>
</div>

<script>
    const deck = document.getElementById('deck');
    const slides = Array.from(deck.querySelectorAll('.slide'));
    const pageEl = document.getElementById('page');

    // 计算“每一页真正的步长”（= slide 的高度）
    function stepHeight() {
        const first = slides[0];
        return first ? first.getBoundingClientRect().height : deck.clientHeight;
    }

    function currentIndex() {
        const h = stepHeight();
        return Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollTop / h)));
    }

    function updatePage() {
        const idx = currentIndex();
        pageEl.textContent = `${idx + 1} / ${slides.length}`;
    }

    function go(delta) {
        const h = stepHeight();
        deck.scrollBy({ top: delta * h, behavior: 'smooth' });
    }

    deck.addEventListener('scroll', () => requestAnimationFrame(updatePage));
    window.addEventListener('resize', () => requestAnimationFrame(updatePage));
    updatePage();

    document.getElementById('prev').addEventListener('click', () => go(-1));
    document.getElementById('next').addEventListener('click', () => go(1));

    window.addEventListener('keydown', (e) => {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'PageDown' || k === ' ') {
            e.preventDefault(); go(1);
        } else if (k === 'ArrowUp' || k === 'PageUp') {
            e.preventDefault(); go(-1);
        }
    });
</script>
</body>
</html>
